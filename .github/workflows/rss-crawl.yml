# 登録済みVTuberの YouTube チャンネル RSS を順番に巡回し、単発実況の候補を rss-state ブランチに保存する。
# - 1回75チャンネル。定期実行を追加したら1日2回(日本時間 6:00・18:00 ごろ)で、293チャンネルを約2日で一巡する予定
# - 巡回スクリプト(watch-standalone-rss.ps1・standalone-matching.ps1)・作品マスタ(data-*.js)・チャンネル対応表
#   (streamer-channel-ids.json)は main から取り出す(書き込まない)
# - 候補JSON・動画ごとの履歴・巡回位置(crawl-state.json)は rss-state ブランチから取り出し、結果も rss-state にだけ保存する
# - 候補は自動登録しない(すべて status=pending のまま。登録は人が確認してから行う)
# - main・登録データ・GitHub Pages は更新しない。YouTube Data API・APIキー・秘密情報は使わない(公開の RSS だけを読む)
# - 保存前に JSON の読み込み・件数(減っていないこと)・巡回位置を検証し、失敗したら push しない
# - push が競合したら強制 push せずに止める(次回の実行が同じ位置からやり直す。同じ動画は重複しない)
# - 既存のワークフロー(home-data / refresh-playlist-meta / search-console-weekly / rss-pwsh-check)とは独立
#
# いまは手動実行(workflow_dispatch)専用。定期実行(schedule)は試験運転で確認してから追加する
# 試験運転(dry_run = true、既定): 巡回・検証・結果の表示までを行い、rss-state への commit・push は一切しない
# 本番(dry_run = false): 保存前の検証をすべて通ったときだけ rss-state に保存する
#   例: gh workflow run rss-crawl.yml -f dry_run=true
name: rss crawl

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試験運転(true: rss-state に保存しない / false: 検証を通ったら rss-state に保存する)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write    # rss-state ブランチへの push だけに使う(main は persist-credentials: false で取り出し、push しない)

concurrency:
  group: rss-crawl
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  MAX_CHANNELS: "75"
  # 保存するのは手動実行で dry_run = false を明示したときだけ(それ以外はすべて試験運転として扱う)
  SAVE_RESULTS: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tools and data (main, read only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout crawl state (rss-state)
        uses: actions/checkout@v4
        with:
          ref: rss-state
          path: state
          fetch-depth: 1

      - name: Check inputs
        shell: pwsh
        run: |
          $need = @("tools/watch-standalone-rss.ps1", "tools/standalone-matching.ps1", "tools/streamer-channel-ids.json",
                    "tools/data-core.js", "tools/data-playlists.js", "tools/data-standalone.js",
                    "state/crawl-state.json", "state/discovered-standalone-rss.json", "state/rss-feeds/entries")
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) { throw ("必要なファイルがありません(巡回しない): " + ($missing -join ", ")) }
          $cs = Get-Content -LiteralPath state/crawl-state.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String
          $start = 0
          if (-not [int]::TryParse([string]$cs.nextIndex, [ref]$start) -or $start -lt 0) { throw "crawl-state.json の nextIndex が正しくない: $($cs.nextIndex)" }
          # 実行前の件数(保存前の検証で、減っていないことを確かめる)
          $cand = Get-Content -LiteralPath state/discovered-standalone-rss.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String
          $hist = 0
          foreach ($f in Get-ChildItem -LiteralPath state/rss-feeds/entries -Filter *.json -File) {
            $hist += @((Get-Content -LiteralPath $f.FullName -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String).videos).Count
          }
          $before = [ordered]@{
            startIndex = $start
            candidates = @($cand.candidates).Count
            unknownGames = @($cand.unknownGames).Count
            historyVideos = $hist
            candidateIds = @($cand.candidates | ForEach-Object { [string]$_.videoId })
          }
          $before | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Encoding utf8
          Write-Output ("PowerShell $($PSVersionTable.PSVersion) / 開始位置 $start / 候補 $($before.candidates) 件・未登録作品 $($before.unknownGames) 作品・履歴 $hist 本")

      - name: Crawl RSS
        shell: pwsh
        run: |
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Raw -Encoding utf8 | ConvertFrom-Json
          $ws = $env:GITHUB_WORKSPACE
          # RSS の取得に失敗したチャンネルはスクリプトが lastRun.errors に記録して次へ進む(終了コードは 0)
          pwsh -NoProfile -File (Join-Path $ws "tools/watch-standalone-rss.ps1") `
            -FeedDir (Join-Path $ws "state/rss-feeds") `
            -OutFile (Join-Path $ws "state/discovered-standalone-rss.json") `
            -ChannelMapPath (Join-Path $ws "tools/streamer-channel-ids.json") `
            -All -MaxChannels ([int]$env:MAX_CHANNELS) -StartIndex ([int]$before.startIndex)
          if ($LASTEXITCODE -ne 0) { throw "巡回スクリプトが失敗した(終了コード $LASTEXITCODE)。保存しない" }

      - name: Validate results
        shell: pwsh
        run: |
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Raw -Encoding utf8 | ConvertFrom-Json
          $fail = New-Object System.Collections.Generic.List[string]
          try { $cand = Get-Content -LiteralPath state/discovered-standalone-rss.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String }
          catch { throw "候補JSONが読めない。保存しない: $($_.Exception.Message)" }
          $s = $cand.lastRun.stats
          $after = @($cand.candidates).Count; $afterUnknown = @($cand.unknownGames).Count
          if ($after -lt $before.candidates) { $fail.Add("候補が減った($($before.candidates) → $after)") }
          if ($afterUnknown -lt $before.unknownGames) { $fail.Add("未登録作品の候補が減った($($before.unknownGames) → $afterUnknown)") }
          $ids = New-Object System.Collections.Generic.HashSet[string]
          foreach ($c in @($cand.candidates)) { [void]$ids.Add([string]$c.videoId) }
          $lost = @(@($before.candidateIds) | Where-Object { $_ -and -not $ids.Contains([string]$_) })
          if ($lost.Count -gt 0) { $fail.Add("以前の候補 $($lost.Count) 件が無くなった") }
          if (@($cand.candidates | Where-Object { [string]$_.status -eq "" }).Count -gt 0) { $fail.Add("status の無い候補がある") }
          $hist = 0
          foreach ($f in Get-ChildItem -LiteralPath state/rss-feeds/entries -Filter *.json -File) {
            try { $hist += @((Get-Content -LiteralPath $f.FullName -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String).videos).Count }
            catch { $fail.Add("履歴JSONが読めない: $($f.Name)") }
          }
          if ($hist -lt $before.historyVideos) { $fail.Add("履歴の動画が減った($($before.historyVideos) → $hist)") }
          if (@(Get-ChildItem -LiteralPath state -Recurse -File -Filter *.tmp).Count -gt 0) { $fail.Add("一時ファイル(.tmp)が残っている") }
          if (@($cand.lastRun.errors | Where-Object { $_.stage -eq "history" }).Count -gt 0) { $fail.Add("履歴JSONの読み書きでエラーがあった") }
          # 巡回位置: 今回の開始位置で巡回し、次の開始位置が対応表の範囲内であること
          $total = [int]$s.crawlTotal; $next = [int]$s.crawlNextIndex
          if ($null -eq $s.crawlNextIndex -or $total -le 0) { $fail.Add("巡回位置が記録されていない") }
          elseif ([int]$s.crawlStartIndex -ne [int]$before.startIndex) { $fail.Add("開始位置が違う($($before.startIndex) / $($s.crawlStartIndex))") }
          elseif ($next -lt 0 -or $next -ge $total) { $fail.Add("次の開始位置が範囲外($next / $total)") }
          # 1チャンネルも取得できなかったときは保存しない(巡回位置を進めず、次回に同じチャンネルを取り直す)
          if ([int]$s.fetchTargets -gt 0 -and [int]$s.fetched -eq 0) { $fail.Add("RSS を1件も取得できなかった(対象 $($s.fetchTargets) チャンネル)") }

          $summary = @(
            "### RSS 巡回の結果",
            $(if ($env:SAVE_RESULTS -eq "true") { "- モード: 本番(検証を通ったら rss-state に保存する)" } else { "- モード: **試験運転**(rss-state には保存しない)" }),
            "- 巡回: 開始位置 $($before.startIndex) → 次回 $next(対応表 $total 件)",
            "- 取得: 対象 $($s.fetchTargets) / 成功 $($s.fetched) / 失敗 $($s.fetchFailed)(再試行 $($s.retried))",
            "- 新規候補 $($s.newCandidates) 件・未登録作品の候補 $($s.unknownGameVideos) 本(すべて確認待ち)",
            "- 候補 $($before.candidates) → $after 件・未登録作品 $($before.unknownGames) → $afterUnknown 作品・履歴 $($before.historyVideos) → $hist 本",
            "- エラー $(@($cand.lastRun.errors).Count) 件・警告 $(@($cand.lastRun.warnings).Count) 件"
          )
          if ($fail.Count -gt 0) { $summary += "- **検証に失敗したため保存しない**: " + ($fail -join " / ") }
          $summary -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $summary | ForEach-Object { Write-Output $_ }
          if ($fail.Count -gt 0) { throw ("検証に失敗した。rss-state に保存しない: " + ($fail -join " / ")) }

          # 次回の巡回位置を記録する(日本時間・LF・BOM なし)
          $state = [ordered]@{
            nextIndex = $next
            maxChannels = [int]$env:MAX_CHANNELS
            updatedAt = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).ToString("yyyy-MM-dd'T'HH:mm:ss")
            note = "RSS 自動巡回の次の開始位置(streamer-channel-ids.json の並び順、0 始まり)。GitHub Actions が更新する"
            lastRun = [ordered]@{ startIndex = [int]$before.startIndex; crawlTotal = $total; fetched = [int]$s.fetched; fetchFailed = [int]$s.fetchFailed; runId = $env:GITHUB_RUN_ID }
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "state/crawl-state.json"), (($state | ConvertTo-Json -Depth 3) + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          "CRAWL_RANGE=$($before.startIndex)-$next" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Dry run (not saved)
        if: ${{ env.SAVE_RESULTS != 'true' }}
        shell: bash
        run: |
          echo "試験運転のため rss-state には保存しない(commit・push しない)"
          echo "- 試験運転のため rss-state には保存していない" >> "$GITHUB_STEP_SUMMARY"

      - name: Save to rss-state
        if: ${{ env.SAVE_RESULTS == 'true' }}
        shell: bash
        working-directory: state
        run: |
          if [ "${SAVE_RESULTS}" != "true" ]; then echo "試験運転のため保存しない"; exit 1; fi   # 念のための二重確認
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 保存するのは候補JSON・巡回位置・動画ごとの履歴だけ(RSS の XML・.bak・.tmp は .gitignore で除外)
          git add -- crawl-state.json discovered-standalone-rss.json rss-feeds/entries
          unexpected="$(git diff --cached --name-only | grep -v -E '^(crawl-state\.json|discovered-standalone-rss\.json|rss-feeds/entries/UC[A-Za-z0-9_-]{22}\.json)$' || true)"
          if [ -n "$unexpected" ]; then echo "保存対象外のファイルがある。保存しない: $unexpected"; exit 1; fi
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "rss: crawl ${CRAWL_RANGE}"
          # 強制 push はしない。競合したら止める(次回の実行が同じ位置からやり直す)
          if ! git push origin HEAD:rss-state; then
            echo "rss-state への push が競合した。強制 push はせずに止める"
            exit 1
          fi
          echo "rss-state に保存した: $(git rev-parse --short HEAD)"
