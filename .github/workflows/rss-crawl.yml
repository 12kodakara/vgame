# 登録済みVTuberの YouTube チャンネル RSS を順番に巡回し、単発実況の候補を rss-state ブランチに保存する。
# - 1回75チャンネル。定期実行は1日1回(日本時間 6:00 ごろ)で、293チャンネルを約4日で一巡する(API は1回 75 unit 前後)
# - 巡回スクリプト(watch-standalone-rss.ps1・standalone-matching.ps1)・作品マスタ(data-*.js)・チャンネル対応表
#   (streamer-channel-ids.json)は main から取り出す(書き込まない)
# - 候補JSON・動画ごとの履歴・巡回位置(crawl-state.json)は rss-state ブランチから取り出し、結果も rss-state にだけ保存する
# - 候補は自動登録しない(すべて status=pending のまま。登録は人が確認してから行う)
# - main・登録データ・GitHub Pages は更新しない
# - 取得元は source で選ぶ: rss(既定。公開の RSS だけを読み、秘密情報は使わない) / api(YouTube Data API。
#   Secret の YOUTUBE_API_KEY を巡回の手順にだけ渡す。値は表示しない。1回の呼び出しは MAX_API_CALLS まで)
# - api では、前回取得できなかったチャンネル(crawl-state.json の retryChannelIds)を先に取り直す
# - 取得の失敗が対象の半数を超えたとき・API の利用枠超過・キー/権限のエラーのときは保存しない
# - 保存前に JSON の読み込み・件数(減っていないこと)・巡回位置を検証し、失敗したら push しない
# - push が競合したら強制 push せずに止める(次回の実行が同じ位置からやり直す。同じ動画は重複しない)
# - 既存のワークフロー(home-data / refresh-playlist-meta / search-console-weekly / rss-pwsh-check)とは独立
#
# 定期実行(schedule): 毎日 21:00 UTC(日本時間 6:00 ごろ。GitHub の混雑で遅れることがある)。取得元は api に固定し、
#   保存前の検証をすべて通ったときだけ rss-state に保存する(refresh-playlist-meta の 19:00 UTC とは時間をずらしている)
# 手動実行(workflow_dispatch)は従来どおり:
# 試験運転(dry_run = true、既定): 巡回・検証・結果の表示までを行い、rss-state への commit・push は一切しない
# 本番(dry_run = false): 保存前の検証をすべて通ったときだけ rss-state に保存する
#   例: gh workflow run rss-crawl.yml -f dry_run=true -f source=api
name: rss crawl

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 21:00 UTC = 日本時間 6:00(cron は常に UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試験運転(true: rss-state に保存しない / false: 検証を通ったら rss-state に保存する)"
        type: boolean
        required: false
        default: true
      source:
        description: "取得元(rss: YouTube のチャンネル RSS / api: YouTube Data API)"
        type: choice
        options: [rss, api]
        required: false
        default: rss

permissions:
  contents: write    # rss-state ブランチへの push だけに使う(main は persist-credentials: false で取り出し、push しない)

concurrency:
  group: rss-crawl
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  MAX_CHANNELS: "75"
  MAX_API_CALLS: "300"   # api のときの1回の呼び出し上限(1 unit/回。失敗した呼び出しも数える)
  INITIAL_MAX_AGE_DAYS: "30"   # api のときだけ: 各チャンネルの初回 API 巡回では、公開から30日を超えた動画を候補にせず履歴に記録する
  # 定期実行は api に固定(入力が無いため、inputs.source だけで決めると rss になってしまう)。手動実行は入力どおり
  SOURCE: ${{ (github.event_name == 'schedule' || inputs.source == 'api') && 'api' || 'rss' }}
  # 保存するのは定期実行のときと、手動実行で dry_run = false を明示したときだけ(それ以外はすべて試験運転として扱う)
  SAVE_RESULTS: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tools and data (main, read only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout crawl state (rss-state)
        uses: actions/checkout@v4
        with:
          ref: rss-state
          path: state
          fetch-depth: 1

      - name: Check inputs
        shell: pwsh
        env:
          HAS_API_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}   # 有無だけ(値は渡さない)
        run: |
          if ($env:SOURCE -eq "api" -and $env:HAS_API_KEY -ne "true") { throw "Secret の YOUTUBE_API_KEY が登録されていません(api では必須)。巡回しない" }
          $need = @("tools/watch-standalone-rss.ps1", "tools/standalone-matching.ps1", "tools/streamer-channel-ids.json",
                    "tools/data-core.js", "tools/data-playlists.js", "tools/data-standalone.js",
                    "state/crawl-state.json", "state/discovered-standalone-rss.json", "state/rss-feeds/entries")
          $missing = @($need | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) { throw ("必要なファイルがありません(巡回しない): " + ($missing -join ", ")) }
          $cs = Get-Content -LiteralPath state/crawl-state.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String
          $start = 0
          if (-not [int]::TryParse([string]$cs.nextIndex, [ref]$start) -or $start -lt 0) { throw "crawl-state.json の nextIndex が正しくない: $($cs.nextIndex)" }
          # 実行前の件数(保存前の検証で、減っていないことを確かめる)
          $cand = Get-Content -LiteralPath state/discovered-standalone-rss.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String
          $hist = 0
          foreach ($f in Get-ChildItem -LiteralPath state/rss-feeds/entries -Filter *.json -File) {
            $hist += @((Get-Content -LiteralPath $f.FullName -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String).videos).Count
          }
          # 前回取得できなかったチャンネル(api のときだけ先に取り直す)と、続けて取得できなかった回数
          $retryIds = @(@($cs.retryChannelIds) | Where-Object { [string]$_ -match '^UC[A-Za-z0-9_-]{22}$' } | ForEach-Object { [string]$_ } | Select-Object -Unique)
          $retryCounts = [ordered]@{}
          if ($cs.retryCounts) { foreach ($p in $cs.retryCounts.PSObject.Properties) { $retryCounts[$p.Name] = [int]$p.Value } }
          $before = [ordered]@{
            startIndex = $start
            source = $env:SOURCE
            retryChannelIds = [object[]]$retryIds
            retryCounts = $retryCounts
            candidates = @($cand.candidates).Count
            unknownGames = @($cand.unknownGames).Count
            historyVideos = $hist
            candidateIds = @($cand.candidates | ForEach-Object { [string]$_.videoId })
            # 試験運転の候補一覧で「今回新しく増えた未登録作品の候補」を見分けるため(作品のキー|動画ID)
            unknownKeys = @($cand.unknownGames | ForEach-Object { [string]$_.key })
            unknownVideos = @($cand.unknownGames | ForEach-Object { $k = [string]$_.key; @($_.videos) | ForEach-Object { $k + "|" + [string]$_.videoId } })
          }
          $before | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Encoding utf8
          Write-Output ("PowerShell $($PSVersionTable.PSVersion) / 取得元 $($env:SOURCE) / 開始位置 $start / 取り直し $($retryIds.Count) チャンネル / 候補 $($before.candidates) 件・未登録作品 $($before.unknownGames) 作品・履歴 $hist 本")

      - name: Crawl RSS
        id: crawl
        shell: pwsh
        env:
          # api のときだけ値を渡す(rss のときは空)。スクリプトは環境変数から読み、表示しない
          YOUTUBE_API_KEY: ${{ env.SOURCE == 'api' && secrets.YOUTUBE_API_KEY || '' }}
        run: |
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Raw -Encoding utf8 | ConvertFrom-Json
          $ws = $env:GITHUB_WORKSPACE
          # 取得に失敗したチャンネルはスクリプトが lastRun.errors に記録して次へ進む(終了コードは 0)
          $a = @("-NoProfile", "-File", (Join-Path $ws "tools/watch-standalone-rss.ps1"),
                 "-FeedDir", (Join-Path $ws "state/rss-feeds"),
                 "-OutFile", (Join-Path $ws "state/discovered-standalone-rss.json"),
                 "-ChannelMapPath", (Join-Path $ws "tools/streamer-channel-ids.json"),
                 "-All", "-MaxChannels", [string][int]$env:MAX_CHANNELS, "-StartIndex", [string][int]$before.startIndex)
          if ($env:SOURCE -eq "api") {
            $a += @("-Source", "Api", "-MaxApiCalls", [string][int]$env:MAX_API_CALLS, "-InitialMaxAgeDays", [string][int]$env:INITIAL_MAX_AGE_DAYS)
            $retry = @($before.retryChannelIds | Where-Object { $_ })
            if ($retry.Count -gt 0) { $a += @("-PriorityChannelId", ($retry -join ",")) }   # 前回取得できなかったチャンネルを先に取り直す
          }
          pwsh @a
          # 終了コード 3 = API キー・権限のエラーで取得をやめた(保存しない)
          if ($LASTEXITCODE -ne 0) { throw "巡回スクリプトが失敗した(終了コード $LASTEXITCODE)。保存しない" }

      - name: Validate results
        shell: pwsh
        run: |
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Raw -Encoding utf8 | ConvertFrom-Json
          $fail = New-Object System.Collections.Generic.List[string]
          try { $cand = Get-Content -LiteralPath state/discovered-standalone-rss.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String }
          catch { throw "候補JSONが読めない。保存しない: $($_.Exception.Message)" }
          $s = $cand.lastRun.stats
          $after = @($cand.candidates).Count; $afterUnknown = @($cand.unknownGames).Count
          if ($after -lt $before.candidates) { $fail.Add("候補が減った($($before.candidates) → $after)") }
          if ($afterUnknown -lt $before.unknownGames) { $fail.Add("未登録作品の候補が減った($($before.unknownGames) → $afterUnknown)") }
          $ids = New-Object System.Collections.Generic.HashSet[string]
          foreach ($c in @($cand.candidates)) { [void]$ids.Add([string]$c.videoId) }
          $lost = @(@($before.candidateIds) | Where-Object { $_ -and -not $ids.Contains([string]$_) })
          if ($lost.Count -gt 0) { $fail.Add("以前の候補 $($lost.Count) 件が無くなった") }
          if (@($cand.candidates | Where-Object { [string]$_.status -eq "" }).Count -gt 0) { $fail.Add("status の無い候補がある") }
          $hist = 0
          foreach ($f in Get-ChildItem -LiteralPath state/rss-feeds/entries -Filter *.json -File) {
            try { $hist += @((Get-Content -LiteralPath $f.FullName -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String).videos).Count }
            catch { $fail.Add("履歴JSONが読めない: $($f.Name)") }
          }
          if ($hist -lt $before.historyVideos) { $fail.Add("履歴の動画が減った($($before.historyVideos) → $hist)") }
          if (@(Get-ChildItem -LiteralPath state -Recurse -File -Filter *.tmp).Count -gt 0) { $fail.Add("一時ファイル(.tmp)が残っている") }
          if (@($cand.lastRun.errors | Where-Object { $_.stage -eq "history" }).Count -gt 0) { $fail.Add("履歴JSONの読み書きでエラーがあった") }
          # 巡回位置: 今回の開始位置で巡回し、次の開始位置が対応表の範囲内であること
          $total = [int]$s.crawlTotal; $next = [int]$s.crawlNextIndex
          if ($null -eq $s.crawlNextIndex -or $total -le 0) { $fail.Add("巡回位置が記録されていない") }
          elseif ([int]$s.crawlStartIndex -ne [int]$before.startIndex) { $fail.Add("開始位置が違う($($before.startIndex) / $($s.crawlStartIndex))") }
          elseif ($next -lt 0 -or $next -ge $total) { $fail.Add("次の開始位置が範囲外($next / $total)") }
          # 1チャンネルも取得できなかったときは保存しない(巡回位置を進めず、次回に同じチャンネルを取り直す)
          if ([int]$s.fetchTargets -gt 0 -and [int]$s.fetched -eq 0) { $fail.Add("1件も取得できなかった(対象 $($s.fetchTargets) チャンネル)") }
          # 取得の失敗が対象の半数を超えたら保存しない(拒否・障害の可能性が高い。巡回位置を進めず、次回に同じチャンネルを取り直す)
          elseif ([int]$s.fetchFailed * 2 -gt [int]$s.fetchTargets) { $fail.Add("取得の失敗が半数を超えた(失敗 $($s.fetchFailed) / 対象 $($s.fetchTargets))") }
          # API の利用枠超過・キーや権限のエラーで止めたときは保存しない
          if ([string]$s.apiStopped -eq "quota") { $fail.Add("API の利用枠を超えた(quotaExceeded)") }
          if ([string]$s.apiStopped -eq "fatal") { $fail.Add("API キーまたは権限のエラー") }
          if ($env:SOURCE -eq "api" -and [string]$s.source -ne "Api") { $fail.Add("api を指定したが API 方式で実行されていない") }

          # 次回に取り直すチャンネル: api は今回取得できなかったもの(成功したものは外れる)。続けて取得できなかった回数を数える
          $prevCounts = @{}; if ($before.retryCounts) { foreach ($p in $before.retryCounts.PSObject.Properties) { $prevCounts[$p.Name] = [int]$p.Value } }
          if ($env:SOURCE -eq "api") { $newRetry = @(@($cand.lastRun.retryChannelIds) | Where-Object { $_ } | ForEach-Object { [string]$_ } | Select-Object -Unique) }
          else { $newRetry = @(@($before.retryChannelIds) | Where-Object { $_ } | ForEach-Object { [string]$_ }) }   # rss では取り直しの一覧を変えない
          $newCounts = [ordered]@{}
          foreach ($id in $newRetry) { $k = [string]$id; $newCounts[$k] = $(if ($env:SOURCE -eq "api") { 1 + [int]$prevCounts[$k] } else { [int]$prevCounts[$k] }) }   # キーは文字列に(PSObject のままだと引けない)
          $needsCheck = @($newRetry | Where-Object { [int]$newCounts[[string]$_] -ge 3 })

          $summary = @(
            "### RSS 巡回の結果",
            $(if ($env:SAVE_RESULTS -eq "true") { "- モード: 本番(検証を通ったら rss-state に保存する)" } else { "- モード: **試験運転**(rss-state には保存しない)" }),
            "- 巡回: 開始位置 $($before.startIndex) → 次回 $next(対応表 $total 件)",
            ("- 取得元: $($env:SOURCE)" + $(if ($env:SOURCE -eq "api") { "(API 呼び出し $($s.apiCalls) / 上限 $($s.maxApiCalls)・読んだページ $($s.apiPages)・取得前に止めた $($s.fetchNotAttempted) チャンネル" + $(if ($s.apiStopped) { "・停止 $($s.apiStopped)" } else { "" }) + ")" } else { "" })),
            "- 取得: 対象 $($s.fetchTargets) / 成功 $($s.fetched) / 失敗 $($s.fetchFailed)(再試行 $($s.retried))",
            ("- 取り直し: 今回先に取得 $(@($before.retryChannelIds).Count) チャンネル → 次回 $($newRetry.Count) チャンネル" + $(if ($needsCheck.Count -gt 0) { "(3回以上続けて取得できない **要確認** $($needsCheck.Count): " + ($needsCheck -join ", ") + ")" } else { "" })),
            "- 新規候補 $($s.newCandidates) 件・未登録作品の候補 動画 $($s.unknownGameVideos) 本(作品別の延べ $($s.unknownGameVideoRows) 件)(すべて確認待ち)",
            "- 確認分類(確認待ち全体 $($s.reviewCategorized) 件): 単発 $($s.reviewSingle) 本 / 続き物 $($s.reviewSeriesGroups) 組・$($s.reviewSeriesVideos) 本 / 再生リスト確認 $($s.reviewPlaylist) 本 / ゲーム実況以外 $($s.reviewNonGameplay) 本",
            $(if ($env:SOURCE -eq "api") { "- 初回 API 巡回: $($s.initialApiChannels) チャンネル・公開から $($s.initialMaxAgeDays) 日を超えた $($s.initialApiSkipped) 本は候補にせず履歴に記録(履歴の印で候補にしなかった動画 $($s.skippedByHistoryMark) 本)" } else { "" }),
            "- 候補 $($before.candidates) → $after 件・未登録作品 $($before.unknownGames) → $afterUnknown 作品・履歴 $($before.historyVideos) → $hist 本",
            "- エラー $(@($cand.lastRun.errors).Count) 件・警告 $(@($cand.lastRun.warnings).Count) 件"
          )
          if ($fail.Count -gt 0) { $summary += "- **検証に失敗したため保存しない**: " + ($fail -join " / ") }
          $summary -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $summary | ForEach-Object { Write-Output $_ }
          if ($fail.Count -gt 0) { throw ("検証に失敗した。rss-state に保存しない: " + ($fail -join " / ")) }

          # 次回の巡回位置を記録する(日本時間・LF・BOM なし)
          $state = [ordered]@{
            nextIndex = $next
            maxChannels = [int]$env:MAX_CHANNELS
            updatedAt = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).ToString("yyyy-MM-dd'T'HH:mm:ss")
            note = "RSS 自動巡回の次の開始位置(streamer-channel-ids.json の並び順、0 始まり)。GitHub Actions が更新する"
            # 次回に先に取り直すチャンネル(api)と、続けて取得できなかった回数
            retryChannelIds = [object[]]$newRetry
            retryCounts = $newCounts
            lastRun = [ordered]@{ source = $env:SOURCE; startIndex = [int]$before.startIndex; crawlTotal = $total; fetched = [int]$s.fetched; fetchFailed = [int]$s.fetchFailed; apiCalls = $s.apiCalls; runId = $env:GITHUB_RUN_ID }
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "state/crawl-state.json"), (($state | ConvertTo-Json -Depth 3) + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          "CRAWL_RANGE=$($before.startIndex)-$next" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      # ---- 試験運転だけ: 今回新しく増えた候補の一覧を artifact(7日間)に残す(検証で保存を止めたときも原因確認用に出す) ----
      - name: Build review files (dry run only)
        id: review
        if: ${{ always() && env.SAVE_RESULTS != 'true' && steps.crawl.outcome == 'success' }}
        shell: pwsh
        run: |
          $before = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "before.json") -Raw -Encoding utf8 | ConvertFrom-Json
          $cand = Get-Content -LiteralPath state/discovered-standalone-rss.json -Raw -Encoding utf8 | ConvertFrom-Json -DateKind String
          $oldIds = New-Object System.Collections.Generic.HashSet[string]
          foreach ($id in @($before.candidateIds)) { if ($id) { [void]$oldIds.Add([string]$id) } }
          $oldKeys = New-Object System.Collections.Generic.HashSet[string]
          foreach ($k in @($before.unknownKeys)) { if ($k) { [void]$oldKeys.Add([string]$k) } }
          $oldUnknownVideos = New-Object System.Collections.Generic.HashSet[string]
          foreach ($v in @($before.unknownVideos)) { if ($v) { [void]$oldUnknownVideos.Add([string]$v) } }

          # 確認に必要な項目だけを残す(公開動画の情報だけ。説明欄・認証情報は含めない)
          $newCands = [object[]]@($cand.candidates | Where-Object { -not $oldIds.Contains([string]$_.videoId) } | ForEach-Object {
            [pscustomobject][ordered]@{
              videoId = [string]$_.videoId; url = [string]$_.url; streamer = [string]$_.streamer; title = [string]$_.title
              publishedDate = [string]$_.publishedDate; game = [string]$_.game; confidence = [string]$_.confidence
              matchType = [string]$_.matchType; reasons = [object[]]@($_.reasons | ForEach-Object { [string]$_ }); reviewGroup = [string]$_.reviewGroup
              reviewCategory = [string]$_.reviewCategory; seriesKey = [string]$_.seriesKey; seriesCount = [int]$_.seriesCount; episodeMarker = [bool]$_.episodeMarker
            }
          })
          $newUnknown = [object[]]@($cand.unknownGames | ForEach-Object {
            $g = $_; $k = [string]$g.key
            $vids = [object[]]@(@($g.videos) | Where-Object { -not $oldUnknownVideos.Contains($k + "|" + [string]$_.videoId) } | ForEach-Object {
              [pscustomobject][ordered]@{ videoId = [string]$_.videoId; url = [string]$_.url; streamer = [string]$_.streamer; title = [string]$_.title; publishedDate = [string]$_.publishedDate; confidence = [string]$_.confidence; reasons = [object[]]@($_.reasons | ForEach-Object { [string]$_ }) }
            })
            if ($vids.Count -gt 0) {
              [pscustomobject][ordered]@{
                name = [string]$g.name; key = $k; newGame = (-not $oldKeys.Contains($k)); confidence = [string]$g.confidence
                videoCount = [int]$g.videoCount; streamers = [object[]]@($g.streamers | ForEach-Object { [string]$_ }); reviewGroup = [string]$g.reviewGroup; newVideos = $vids
              }
            }
          })
          $byConf = [ordered]@{ HIGH = 0; MEDIUM = 0; LOW = 0; other = 0 }
          foreach ($c in $newCands) { if ($byConf.Contains($c.confidence) -and $c.confidence -ne "other") { $byConf[$c.confidence]++ } else { $byConf.other++ } }
          # 確認分類ごとの件数(動画の本数)と、続き物のまとまり(VTuber|作品)の組数
          $byCat = [ordered]@{ single = 0; series = 0; "playlist-review" = 0; "non-gameplay" = 0; none = 0 }
          foreach ($c in $newCands) { if ($c.reviewCategory -and $byCat.Contains($c.reviewCategory)) { $byCat[$c.reviewCategory]++ } else { $byCat.none++ } }
          $seriesGroups = [object[]]@($newCands | Where-Object { $_.reviewCategory -eq "series" } | Group-Object seriesKey | Sort-Object @{ Expression = { $_.Count }; Descending = $true }, Name | ForEach-Object {
            [pscustomobject][ordered]@{ seriesKey = $_.Name; streamer = [string]$_.Group[0].streamer; game = [string]$_.Group[0].game; videoCount = $_.Count; videoIds = [object[]]@($_.Group | ForEach-Object { $_.videoId }) } })

          $dir = Join-Path $env:RUNNER_TEMP "rss-review"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $meta = [ordered]@{ generatedAt = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9)).ToString("yyyy-MM-dd'T'HH:mm:ss"); runId = $env:GITHUB_RUN_ID; startIndex = [int]$before.startIndex; nextIndex = $cand.lastRun.stats.crawlNextIndex
                    source = $env:SOURCE; apiCalls = $cand.lastRun.stats.apiCalls; apiStopped = [string]$cand.lastRun.stats.apiStopped
                    retryFirst = [object[]]@($before.retryChannelIds | Where-Object { $_ }); retryNext = [object[]]@($cand.lastRun.retryChannelIds | Where-Object { $_ })
                    initialApiChannels = $cand.lastRun.stats.initialApiChannels; initialApiSkipped = $cand.lastRun.stats.initialApiSkipped; skippedByHistoryMark = $cand.lastRun.stats.skippedByHistoryMark }
          $candDoc = [ordered]@{}; foreach ($k in $meta.Keys) { $candDoc[$k] = $meta[$k] }
          $candDoc["count"] = $newCands.Count; $candDoc["byConfidence"] = $byConf; $candDoc["byCategory"] = $byCat; $candDoc["seriesGroupCount"] = $seriesGroups.Count; $candDoc["seriesGroups"] = $seriesGroups; $candDoc["candidates"] = $newCands   # .count は辞書の Count と重なるため添字で入れる
          # RSS の取得に失敗したチャンネル(公開のチャンネルID・VTuber名・理由だけ。原因の確認用に同じファイルへ入れる)
          $fetchFailures = [object[]]@($cand.lastRun.errors | Where-Object { $_.stage -eq "fetch" -and $_.channelId -and $_.attempts } | ForEach-Object {
            [pscustomobject][ordered]@{ channelId = [string]$_.channelId; streamer = [string]$_.streamer; reason = [string]$_.reason; status = $_.status; attempts = [int]$_.attempts; attemptReasons = [object[]]@($_.attemptReasons | ForEach-Object { [string]$_ }) }
          })
          $candDoc["fetchFailureCount"] = $fetchFailures.Count; $candDoc["fetchFailures"] = $fetchFailures
          [IO.File]::WriteAllText((Join-Path $dir "new-candidates.json"), ((ConvertTo-Json -InputObject ([pscustomobject]$candDoc) -Depth 6) + "`n"), $utf8)
          $unkDoc = [ordered]@{}; foreach ($k in $meta.Keys) { $unkDoc[$k] = $meta[$k] }
          # 動画の実数(重複を除いた動画ID)と、作品別の延べ件数(1本が複数の作品名に入ることがある)を分けて記録する
          $unkVideoRows = @($newUnknown | ForEach-Object { @($_.newVideos) } | Where-Object { $_ })
          $unkVideoUnique = @($unkVideoRows | ForEach-Object { [string]$_.videoId } | Sort-Object -Unique)
          $unkDoc["count"] = $newUnknown.Count; $unkDoc["videoCount"] = $unkVideoUnique.Count; $unkDoc["videoRows"] = $unkVideoRows.Count; $unkDoc["unknownGames"] = $newUnknown
          [IO.File]::WriteAllText((Join-Path $dir "new-unknown-games.json"), ((ConvertTo-Json -InputObject ([pscustomobject]$unkDoc) -Depth 6) + "`n"), $utf8)
          # CSV: Excel で文字化けしないよう BOM 付き UTF-8・CRLF。判定理由は " / " でつなぐ
          $q = { param($v) '"' + ([string]$v).Replace('"', '""') + '"' }
          $csv = New-Object System.Collections.Generic.List[string]
          $csv.Add((@("videoId", "url", "streamer", "title", "publishedDate", "game", "confidence", "matchType", "reasons", "reviewGroup", "reviewCategory", "seriesKey", "seriesCount", "episodeMarker") | ForEach-Object { & $q $_ }) -join ",")
          foreach ($c in $newCands) {
            $csv.Add((@($c.videoId, $c.url, $c.streamer, $c.title, $c.publishedDate, $c.game, $c.confidence, $c.matchType, (@($c.reasons) -join " / "), $c.reviewGroup, $c.reviewCategory, $c.seriesKey, $c.seriesCount, $c.episodeMarker) | ForEach-Object { & $q $_ }) -join ",")
          }
          [IO.File]::WriteAllText((Join-Path $dir "new-candidates.csv"), (($csv -join "`r`n") + "`r`n"), (New-Object System.Text.UTF8Encoding($true)))

          $line = "- 新規候補の信頼度: HIGH $($byConf.HIGH) / MEDIUM $($byConf.MEDIUM) / LOW $($byConf.LOW)" + $(if ($byConf.other -gt 0) { " / その他 $($byConf.other)" } else { "" }) + "(候補一覧は artifact に7日間保存)"
          $line2 = "- 未登録作品の候補: 新しい動画のある作品 $($newUnknown.Count)(うち新しい作品 $(@($newUnknown | Where-Object { $_.newGame }).Count))・動画 $($unkVideoUnique.Count) 本(作品別の延べ $($unkVideoRows.Count) 件)"
          $line3 = "- RSS の取得に失敗したチャンネル: $($fetchFailures.Count)(一覧は artifact の new-candidates.json の fetchFailures)"
          $line4 = "- 新規候補の確認分類(動画 $($newCands.Count) 本): 単発 $($byCat.single) 本 / 続き物 $($seriesGroups.Count) 組・$($byCat.series) 本 / 再生リスト確認 $($byCat['playlist-review']) 本 / ゲーム実況以外 $($byCat['non-gameplay']) 本" + $(if ($byCat.none -gt 0) { " / 分類なし $($byCat.none) 本" } else { "" })
          ($line, $line4, $line2, $line3) -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Output $line; Write-Output $line4; Write-Output $line2; Write-Output $line3

      - name: Upload review files (dry run only)
        if: ${{ always() && env.SAVE_RESULTS != 'true' && steps.review.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rss-crawl-review-${{ github.run_id }}
          path: ${{ runner.temp }}/rss-review/
          retention-days: 7
          if-no-files-found: error

      - name: Dry run (not saved)
        if: ${{ env.SAVE_RESULTS != 'true' }}
        shell: bash
        run: |
          echo "試験運転のため rss-state には保存しない(commit・push しない)"
          echo "- 試験運転のため rss-state には保存していない" >> "$GITHUB_STEP_SUMMARY"

      - name: Save to rss-state
        if: ${{ env.SAVE_RESULTS == 'true' }}
        shell: bash
        working-directory: state
        run: |
          if [ "${SAVE_RESULTS}" != "true" ]; then echo "試験運転のため保存しない"; exit 1; fi   # 念のための二重確認
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 保存するのは候補JSON・巡回位置・動画ごとの履歴だけ(RSS の XML・.bak・.tmp は .gitignore で除外)
          git add -- crawl-state.json discovered-standalone-rss.json rss-feeds/entries
          unexpected="$(git diff --cached --name-only | grep -v -E '^(crawl-state\.json|discovered-standalone-rss\.json|rss-feeds/entries/UC[A-Za-z0-9_-]{22}\.json)$' || true)"
          if [ -n "$unexpected" ]; then echo "保存対象外のファイルがある。保存しない: $unexpected"; exit 1; fi
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "rss: crawl ${CRAWL_RANGE}"
          # 強制 push はしない。競合したら止める(次回の実行が同じ位置からやり直す)
          if ! git push origin HEAD:rss-state; then
            echo "rss-state への push が競合した。強制 push はせずに止める"
            exit 1
          fi
          echo "rss-state に保存した: $(git rev-parse --short HEAD)"
